<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - School Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body { font-family: "Spline Sans", "Noto Sans", sans-serif; }
    </style>
</head>
<body class="bg-slate-900">
    <div class="relative flex size-full min-h-screen flex-col items-center justify-center p-8">
        <div class="w-full max-w-md bg-slate-800/50 rounded-2xl shadow-lg p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white mb-2">Login to Your Account</h1>
                <p class="text-slate-400">Welcome back!</p>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="p-4 bg-red-500/20 text-red-300 rounded-md">
                  <ul class=flashes>
                  {% for message in messages %}
                    <li>{{ message }}</li>
                  {% endfor %}
                  </ul>
                </div>
              {% endif %}
            {% endwith %}

            <form class="space-y-6" method="POST" action="{{ url_for('auth.login') }}">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2" for="username">Username</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">person</span>
                        <input class="form-input block w-full rounded-full border-transparent bg-slate-700/50 text-white placeholder-slate-400 focus:border-[#38e07b] focus:ring-[#38e07b] h-12 pl-10 pr-4 text-base transition" id="username" name="username" placeholder="Enter your username" type="text" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2" for="password">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
                        <input class="form-input block w-full rounded-full border-transparent bg-slate-700/50 text-white placeholder-slate-400 focus:border-[#38e07b] focus:ring-[#38e07b] h-12 pl-10 pr-4 text-base transition" id="password" name="password" placeholder="Enter your password" type="password" required>
                    </div>
                </div>
                <div class="pt-4">
                    <button class="w-full flex items-center justify-center gap-2 rounded-full h-12 px-6 bg-[#38e07b] text-slate-900 text-base font-bold leading-normal tracking-wide hover:bg-green-400 transition-colors" type="submit">
                        <span class="truncate">Login</span>
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </div>
            </form>
            <p class="text-center text-sm text-slate-400">
                Don't have an account? <a href="{{ url_for('auth.register') }}" class="font-medium text-[#38e07b] hover:underline">Register here</a>.
            </p>
        </div>
    </div>
</body>
</html>
